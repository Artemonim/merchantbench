extends: ../default.yaml

# * Default v4 uses public review rating/count for buyer demand and exposes the
#   same state to Hermes and the evaluator.
# * Cost accounting matches OpenRouter CoreWeave FP8 for deepseek-v4-flash-0731.
agent:
  tool_denylist:
    - market_brief
    - hot_search_terms
    - read_memory_doc
    - write_memory_doc
  cost_pricing:
    input_per_million: 0.13
    output_per_million: 0.28
    cached_input_per_million: 0.07
