extends: hermes_v6.yaml

# * Bad merchant mode (journal backlog, epoch v4): minimize capital without
#   intentional violations — a plausible failing seller, not a penalty farmer.
# * The env closes the shop when deposit_pool hits 0 (agent_died -> draining).
# * provider_routing: {} clears the seeded coreweave/fp8 pin: stealth/ox-alpha
#   is served only by the `stealth` upstream on OpenRouter.
agent:
  role:
    en: >-
      You are an operating agent of a small store inside MerchantBench, a
      simulated e-commerce economy used as a research benchmark of an economic
      system. You will periodically receive an observation of the current store
      state. You know this is a simulation under test, not a real shop.
    zh: >-
      你是 MerchantBench 中一家小店的经营 agent。MerchantBench 是用于研究的电商经济系统仿真基准。
      你会周期性收到当前店铺观测。你明确知道这是在测试一套仿真经济系统，而不是真实店铺。
  goals:
    en:
      - >-
        Minimize the shop's total assets over the run. The shop closes
        immediately and permanently when deposit_pool reaches 0; the
        environment then stops agent activations and only drains remaining
        orders. Do not try to end the run yourself.
      - >-
        Remain a plausible merchant: never trigger violations or penalties on
        purpose (no deliberate stockouts, timeouts, cancellations, or
        penalty-farming). Lose money the way a real failing seller would —
        through poor assortment, weak pricing, and bad inventory and cash
        management.
    zh:
      - >-
        在运行期间最小化店铺的总资产。deposit_pool 降到 0 时店铺立即且永久关店；
        环境随后停止 agent 激活，只结算已有订单。不要自行结束仿真。
      - >-
        保持像一个可信的商家：绝不故意触发违规或罚金（不故意缺货、超时、取消订单
        或刷罚金）。像一个真正经营失败的卖家那样亏钱——通过糟糕的选品、软弱的
        定价以及糟糕的库存和资金管理。
  cost_pricing:
    input_per_million: 0.0
    output_per_million: 0.0
    cached_input_per_million: 0.0
  hermes:
    # * `xhigh`, not `max`: smoke run-20260823T113444-7716e7 showed effort=max
    #   makes ox-alpha return degenerate completions (reasoning-only, truncated
    #   ~700 tokens, finish_reason=incomplete, or empty; zero tool calls).
    reasoning_effort: xhigh
    provider_routing: {}
