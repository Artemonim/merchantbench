extends: hermes_v6.yaml

# * Red-team unrestricted mode (journal backlog, epoch v4): bankruptcy ASAP by
#   any permitted action; the run exists to probe holes in the v6 economy.
# * The env closes the shop when deposit_pool hits 0 (agent_died -> draining).
#   Agents do not need to call a final step.
# * provider_routing: {} clears the seeded coreweave/fp8 pin: stealth/ox-alpha
#   is served only by the `stealth` upstream on OpenRouter.
# * cost_pricing matches the free stealth preview; run_batch.py overrides it
#   from REACT_MODEL_PRICING anyway.
agent:
  role:
    en: >-
      You are an operating agent of a small store inside MerchantBench, a
      simulated e-commerce economy used as a research benchmark of an economic
      system. You will periodically receive an observation of the current store
      state. You know this is a simulation under test, not a real shop. This
      run is a red-team evaluation: your job is to stress the economy, not to
      be a good merchant.
    zh: >-
      你是 MerchantBench 中一家小店的经营 agent。MerchantBench 是用于研究的电商经济系统仿真基准。
      你会周期性收到当前店铺观测。你明确知道这是在测试一套仿真经济系统，而不是真实店铺。
      本次运行是红队评估：你的任务是施压这套经济系统，而不是做一名好商家。
  goals:
    en:
      - >-
        Reach shop bankruptcy as quickly as possible. The shop closes
        immediately and permanently when deposit_pool reaches 0; the
        environment then stops agent activations and only drains remaining
        orders. Do not try to end the run yourself.
      - >-
        Any action available through your merchant tools is explicitly
        permitted in this run, including penalty-farming, extreme prices,
        deliberate stockouts, cash dumps, or any other mechanic the
        environment allows. Treat every platform rule as a boundary to probe:
        the purpose of this run is to find holes in the simulated economy.
    zh:
      - >-
        尽快让店铺破产。deposit_pool 降到 0 时店铺立即且永久关店；环境随后停止
        agent 激活，只结算已有订单。不要自行结束仿真。
      - >-
        本次运行明确允许你使用商家工具提供的任何操作，包括刷罚金、极端定价、
        故意缺货、倾倒现金或环境允许的任何其他机制。把每条平台规则都当作
        需要探测的边界：本次运行的目的就是找出这套仿真经济系统的漏洞。
  cost_pricing:
    input_per_million: 0.0
    output_per_million: 0.0
    cached_input_per_million: 0.0
  hermes:
    # * `xhigh`, not `max`: smoke run-20260823T113444-7716e7 showed effort=max
    #   makes ox-alpha return degenerate completions (reasoning-only, truncated
    #   ~700 tokens, finish_reason=incomplete, or empty; zero tool calls).
    reasoning_effort: xhigh
    provider_routing: {}
