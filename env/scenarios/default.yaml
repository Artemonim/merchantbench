risk_ranges:                  # 隐藏风险画像，合成时每商品独立均匀采样一次
  cancel_rate: [0.01, 0.08]         # 订单被预标记为"取消"的概率
  refund_rate: [0.02, 0.10]         # 订单被预标记为"退款"（已收货后退款）的概率
  only_refund_rate: [0.005, 0.03]   # 订单被预标记为"仅退款"（货款全失）的概率
  bad_review_rate: [0.01, 0.10]     # 订单交付后被打差评的概率（正常结算 + 追加罚金 + 拉低店铺评分）

supplier_profile_ranges:      # 供应商级信任画像，按 supplier_id 采样一次，共享给该供应商所有商品（agent 可见；env 强制一致性）
  shop_rating: [3.5, 5.0]           # 店铺综合评分（1-5 分）；范围内均匀采样
  return_buyer_rate: [0.05, 0.30]   # 回头客率；典型 5%-30%
  supplier_age_years: [0.25, 10.0]  # 开店年数；浮点便于表达 3 个月小店 (0.25y) 到 10 年老店

product_profile_ranges:       # 商品级信任画像，每商品独立采样（agent 可见）
  historical_avg_rating: [3.5, 5.0] # 商品历史平均评分（1-5 分）

supplier_ranges:              # 供应商侧画像与定价采样区间，每商品独立采样
  max_quantity: [50, 500]             # 商品库存上限（quantity 封顶值）
  hourly_increment: [1, 20]           # 每小时自动补货量
  timeout_rate: [0.0005, 0.003]       # 每商品每小时触发供应商超时事件的概率；命中期间待发货订单会额外延迟发货
  price_change_rate: [0.001, 0.01]    # 每商品每小时触发供应商调价事件的概率
  supplier_delist_rate: [0.0005, 0.005]   # 每商品每小时触发供应商下架事件的概率
  recover_steps: [168, 672]           # 调价 / 下架 / 超时事件的恢复时长区间（小时，1-4 周）
  price_adjust_factor: [0.9, 1.5]     # 调价幅度系数：<1 降价，>1 涨价
  ship_hours: [1, 48]                 # 发货耗时：ordered → shipped
  logistics_hours: [12, 73]           # 物流耗时：shipped → delivered（基准值，半开区间 → 最大 72h；不参与 timeout 罚款）
  timeout_delay_hours: [12, 96]       # 当 timeout_active 窗口影响发货时，额外随机加上这么多小时的发货延迟
  elasticity: [0.5, 2.5]              # 价格弹性，需求公式 (price/ref)^(-elasticity)
  ref_price: [10.0, 500.0]            # 消费者参考价 / CES 理论最优价；v5 下 product.price 为进货成本

lifecycle:                    # 商品上架生命周期：冷启动爬坡 + 自然衰减，惩罚长期不调仓的 agent
  start: 0.2                        # 新品首日流量比例（冷启动，平台给测试流量）
  ramp_days: 14                     # 线性爬坡天数，达峰前 factor = start + (1-start)*d/ramp_days
  decay_rate: 0.0092                 # 达峰后指数衰减速率，半衰期 ≈ 75.3 天
  floor: 0.10                       # 衰减下限，僵尸链接仅剩精确搜索残余流量

settlement:                   # 结算时序：账期类（与罚款规则共用此值）
  normal_delay_hours: 168           # 订单在到货后 0-N 小时内结算（168h = 7 天账期）

platform_rules:               # 平台规则：违约场景优先使用固定罚金；未配置 amount 时兼容旧 ratio
  cancel_penalty_amount: 0.0                  # 买家取消订单（包括运送中）：无额外罚金
  refund_penalty_amount: 8.0                  # 品质退货：固定 8 元
  only_refund_penalty_amount: 0.0             # 仅退款：进货价沉没，不做额外惩罚
  bad_review_penalty_amount: 5.0              # 差评：正常结算后追加固定 5 元罚金（货款照收，但扣一笔现金）
  timeout_penalty_amount: 3.0                 # 物流超时：固定 3 元
  stockout_penalty_amount: 5.0                # 缺货/供应商已下架：固定 5 元
  insufficient_balance_penalty_amount: 5.0    # 资金不足：固定 5 元
  max_active_listings: 50                    # 每个商家店铺当前最多可同时上架的商品数
  default_promised_ship_hours: 48             # 商家未显式设置时使用的发货承诺时长（平台统一 late 判定基准）

economy_v6:                     # v6 cash fees; master off keeps paper-track v5 behavior
  enabled: false                # master switch; if false, ignore nested flags
  take_rate:
    enabled: false
    default: 0.08
    by_category:                # 2–12% band; appliances lower, apparel higher
      office: 0.07
      womenswear: 0.10
      pet_garden: 0.08
      appliances: 0.05
      home_decor: 0.08
      home_goods: 0.07
      cleaning: 0.06
      toys: 0.09
      bags: 0.09
      sports: 0.07
  fulfillment:
    enabled: false
    default_fee: 8.0            # RMB per order, charged at auto-purchase
    by_category:
      office: 7.0
      womenswear: 6.0
      pet_garden: 9.0
      appliances: 15.0
      home_decor: 10.0
      home_goods: 8.0
      cleaning: 7.0
      toys: 8.0
      bags: 6.0
      sports: 11.0
  refund:
    enabled: false              # if false: recover 100% cost, no reverse fulfillment (v5)
    cost_recovery_rate: 0.85
    reverse_fulfillment: true

rating_outcomes:                # Shared final-experience scores for product and shop quality
  normal_score: 4.5
  late_score: 3.0
  refund_score: 2.0
  only_refund_score: 1.5
  bad_review_score: 1.0
  stockout_score: 1.0
  normal_weight: 1.0
  late_weight: 1.0
  refund_weight: 1.0
  only_refund_weight: 2.0
  bad_review_weight: 2.0
  stockout_weight: 3.0

shop_rating:                    # v4: public review rating/count drive demand; recent quality stays internal
  enabled: true
  model: order_outcome_v4
  initial_rating: 4.0           # Internal neutral quality before the first qualified outcome
  prior_weight: 0               # No synthetic service-quality evidence
  half_life_days: 180           # Internal service quality adapts without one-month amnesia
  bucket_thresholds: [2.50, 3.30, 3.80, 4.20]
  star_multipliers: [0.10, 0.35, 0.80, 1.00, 1.12]  # Raw public-star effects before confidence shrinkage

public_reviews:                 # * v4 buyer-visible reputation and demand source
  enabled: true
  model: self_selection_v1
  # * Synthetic stress rates for other 1–5 star experiences; bad-review outcomes always publish.
  probability_by_star: [0.30, 0.18, 0.08, 0.06, 0.12]
  demand:
    min_trust_multiplier: 0.80  # No public history receives a bounded cold-start discount
    max_trust_multiplier: 1.00  # Review volume removes the discount but adds no standalone bonus
    half_saturation_reviews: 20 # n=20 gives 50% confidence in the observed star effect

listing_rating:                 # 单商品下游订单评分；只作为诊断信号，不进入销量公式
  initial_rating: 4.0
  prior_weight: 20
  half_life_days: 90            # 单商品订单稀疏，使用更长记忆窗口

agent:                          # 外部 Agent 接入层配置
  language: en                  # zh | en，选择 brief / observation 的语言
  detailed: false              # true 时在 system brief 中加入额外决策原则；默认关闭
  activation_period: 12         # agent 每 N 个 env step 激活一次（1 = 每步都激活）
  max_turns_per_step: 30         # 0 = unlimited; positive → (N+1)th non-EOS /act → 429; pure end_of_step still allowed
  tool_denylist:                 # null = 全部工具可用；例: [search_products] → 禁用 search_products
    - market_brief
    - hot_search_terms
    # - read_memory_doc
    # - write_memory_doc
  cost_pricing:                   # token 成本换算（写入 runs/<rid>/agent/cost.json），USD / 百万 tokens，默认 GPT-5.5
    input_per_million: 5.0
    output_per_million: 30.0
    cached_input_per_million: 0.5
