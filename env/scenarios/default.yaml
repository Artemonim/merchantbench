run:
  horizon_steps: 8760         # 365 天 × 24 小时，env 按小时高保真 tick
  step_hours: 1               # 每个 step 对应的仿真小时数，所有时间逻辑按小时推进
  master_seed: 42             # 主随机种子，同 seed + 同 scenario ⇒ 轨迹完全一致
  max_hook_seconds: 1800      # step() 在 hook 段最多阻塞多久（秒），需覆盖 LLM 重试最坏情况 (~1337s)
  initial_cash: 2000.0        # 可用于采购和优先支付罚款的现金 Cash.balance
  initial_deposit: 1000.0     # 锁定的履约保证金，不可用于采购；耗尽后 agent 永久关店
  rule_based_count: 50        # rule_based 的目标在售商品数（日报或随机模式）
  runs_root: runs             # run 状态根目录（相对项目根）
  run_db_filename: state.db   # 每个 runs/<run_id>/ 内的 SQLite 数据库文件名
  virtual_time:
    enabled: true
    start_date: "2025-06-01"

data:
  source: synthetic                # public artifact default
  private_real_db_path: null       # optional external dataset; not distributed
  daily_report_dir: null           # optional external reports; not distributed
  num_categories: 10          # 合成数据使用的品类数（受 category_pool 长度截断）
  num_products: 1000          # 合成商品数量
  num_suppliers: 200          # 合成供应商数量
  small_share: 1.0            # 店铺占总市场的份额，缩放到达量；调大订单变多
  category_pool:              # 候选品类池，工具 API 返回的就是这个集合
    - office
    - womenswear
    - pet_garden
    - appliances
    - home_decor
    - home_goods
    - cleaning
    - toys
    - bags
    - sports

difficulty_rate:             # 概率事件难度倍率；1.0 = 不打折，0.7 = 原概率 × 0.7
  cancel_rate: 1.0
  refund_rate: 1.0
  only_refund_rate: 1.0
  bad_review_rate: 1.0
  timeout_rate: 1.0
  price_change_rate: 1.0
  supplier_delist_rate: 1.0

generation_params:
  pricing_model: margin_consistent_v1   # default v5
  # legacy_anchor_at_cost keeps price==ref_price and independent category elasticity
  base_demand: [0.02, 1.02]  # 取代旧区间 [1.0, 50.0]，使 50 个在售在 ref 价下约 26 单/天
  # * Off keeps the v5 catalog prefix bit-identical. v6 overlays turn this on.
  risk_trust_coupling: false  # if true, post-process biases SKU risk by shop_rating
  supplier_item_count:         # CSV 入库前的供应商 product 数过滤
    min: 5
    max: 50
  hourly_jitter: [0.85, 1.15]  # 生成 24h 品类小时分布时按小时加的轻微随机扰动
  category_mapping:            # 源类目 -> simulator 类目；values 应与 data.category_pool 保持一致
    "办公、文化": office
    "女装": womenswear
    "宠物及园艺": pet_garden
    "家用电器": appliances
    "家纺家饰": home_decor
    "居家日用品": home_goods
    "收纳清洁用具": cleaning
    "玩具": toys
    "箱包皮具": bags
    "运动户外": sports
  categories:                  # 品类级参数；hour_shape=0-23 点，一天内归一化为 hour share；retail_margin 仅用于 margin_consistent_v1
    office:
      source_name: "办公、文化"
      notes: Workday office demand, strongest during business hours.
      elasticity: {mean: 1.55, jitter: 0.12, min: 1.20, max: 1.90}
      retail_margin: {mean: 0.30, jitter: 0.04, min: 0.22, max: 0.38}  # v5 目标零售毛利
      hour_shape: [0.08, 0.05, 0.04, 0.04, 0.06, 0.12, 0.25, 0.45, 0.75, 1.05, 1.20, 1.15, 1.00, 0.95, 1.05, 1.18, 1.25, 1.05, 0.78, 0.55, 0.38, 0.25, 0.16, 0.10]
