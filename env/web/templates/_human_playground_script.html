  function handleObservation(observation) {
    const observedT = Number(observation.tick?.step);
    const sameStep = Number.isFinite(observedT) && state.latestEnvT === observedT;
    const isNewStep = !sameStep;
    const resumeSeconds = sameStep && state.countdownRemainingSeconds > 0 ? state.countdownRemainingSeconds : null;
    const observedTurnCount = Number(observation.turn_count);
    state.latestTick = observation.tick || {};
    state.latestEnvT = Number.isFinite(observedT) ? observedT : null;
    state.turnCount = Number.isFinite(observedTurnCount)
      ? Math.max(0, Math.floor(observedTurnCount))
      : (sameStep ? state.turnCount : 0);
    if (isNewStep) invalidateOperationalData();
    beginStepMinimumDuration(isNewStep);
    $("turn-count").textContent = String(state.turnCount);
    $("run-day").textContent = state.latestTick.day ?? "—";
    $("run-hour").textContent = state.latestTick.hour ?? "—";
    $("run-datetime").textContent = formatSimulationDateTime(state.latestTick);
    $("tick-summary").textContent = formatTime(state.latestTick);
    setStepActive(true);
    startCountdown(resumeSeconds);
    if (isNewStep) renderAll();
    return isNewStep;
  }

  async function observeLoop() {
    while (!state.finished) {
      if (state.runState === "paused") { pauseCurrentHookUi(); await delay(500); continue; }
      try {
        const response = await fetch(`${PLAYGROUND_CONFIG.observationUrl}?timeout=30`);
        if (response.status === 408) continue;
        if (response.status === 410) {
          const terminal = await response.json().catch(() => ({}));
          const status = await refreshStatus();
          if (state.finished) break;
          state.finished = true;
          setStepActive(false);
          const terminalPhase = status?.phase || status?.state;
          if (terminalPhase === "draining") {
            setStepCopy(
              terminal?.error === "agent_dead" ? "店铺已关闭，订单结算中" : "进入结算阶段",
              "不会再生成新订单或开启经营窗口，环境正在处理已有订单",
            );
          } else if (terminal?.error === "agent_dead") {
            setStepCopy(
              "店铺已关闭",
              "当前经营者已退出；环境将根据其他经营者与剩余订单状态继续运行或结算",
            );
          } else {
            setStepCopy("运行正在结束", "正在等待环境写入最终状态");
          }
          break;
        }
        if (!response.ok) throw new Error(`observation HTTP ${response.status}`);
        const observation = await response.json();
        await waitForPendingCall();
        if (state.finished) break;
        if (state.runState === "paused") { pauseCurrentHookUi(); continue; }
        const isNewStep = handleObservation(observation);
        if (isNewStep) {
          await runAutoRefresh();
          showRoundReadyOverlay();
        }
        while (state.stepActive && !state.finished) await delay(400);
      } catch (error) {
        announce(`观察连接异常：${error.message}`, "error");
        await delay(1500);
      }
    }
  }

  async function activateRuntimeSession() {
    if (state.runtimeActivationPromise) return state.runtimeActivationPromise;
    state.runtimeActivationPromise = (async () => {
      if (!state.toolsLoaded) await fetchTools();
      await registerHuman();
      if (!state.eventSource) connectSSE();
      if (!state.observing) {
        state.observing = true;
        void observeLoop().finally(() => { state.observing = false; });
      }
    })();
    try {
      await state.runtimeActivationPromise;
    } finally {
      state.runtimeActivationPromise = null;
    }
  }

  function connectSSE() {
    const source = new EventSource(PLAYGROUND_CONFIG.streamUrl);
    state.eventSource = source;
    const handle = event => {
      const data = JSON.parse(event.data || "{}");
      if (data.elapsed_ms !== undefined) captureElapsed(data.elapsed_ms);
      if (Number.isFinite(Number(data.t))) state.statusEnvT = Number(data.t);
      const eventState = data.state || data.phase || data.type;
      if (eventState) updateRunState(eventState);
      if (data.type === "tick") {
        setStepActive(false);
        if (!["finished", "stopped"].includes(eventState)) showRoundWaitingOverlay();
      }
      if (["finished", "stopped"].includes(eventState)) enterTerminalState(eventState);
    };
    source.addEventListener("hello", handle);
    source.addEventListener("tick", handle);
    source.addEventListener("finished", handle);
    source.addEventListener("stopped", handle);
    source.addEventListener("error", () => {});
  }

  async function refreshStatus() {
    try {
      const response = await fetch(PLAYGROUND_CONFIG.statusUrl);
      if (!response.ok) return null;
      const status = await response.json();
      captureElapsed(status.elapsed_ms);
      if (Number.isFinite(Number(status.t))) state.statusEnvT = Number(status.t);
      updateRunState(status.state);
      if (["finished", "stopped"].includes(status.state)) enterTerminalState(status.state);
      return status;
    } catch (_error) {
      return null;
    }
  }

  async function postRunControl(action) {
    const url = action === "pause" ? PLAYGROUND_CONFIG.pauseUrl : PLAYGROUND_CONFIG.resumeUrl;
    const response = await fetch(url, {method: "POST", headers: {"Content-Type": "application/json"}, body: "{}"});
    const body = await response.json().catch(() => ({}));
    if (!response.ok || body.error) { announce(`运行控制失败：${body.error || response.status}`, "error"); return; }
    updateRunState(body.state);
    if (body.state === "running") {
      try {
        await activateRuntimeSession();
      } catch (error) {
        announce(`恢复运行后重连失败：${error.message}`, "error", 10000);
        return;
      }
    }
    if (body.state === "running" && state.countdownRemainingSeconds > 0) {
      const remaining = state.countdownRemainingSeconds;
      setStepActive(true);
      startCountdown(remaining);
    }
  }

  function bindEvents() {
    qsa("[data-go-view]").forEach(button => button.addEventListener("click", () => activateWorkspace(button.dataset.goView)));
    qsa("[data-scroll-panel]").forEach(button => button.addEventListener("click", () => activateWorkspace(button.dataset.scrollPanel)));
    qsa("[data-product-tab]").forEach(button => button.addEventListener("click", () => {
      state.currentProductTab = button.dataset.productTab;
      qsa("[data-product-tab]").forEach(item => item.classList.toggle("active", item === button));
      qsa("[data-product-panel]").forEach(panel => panel.classList.toggle("active", panel.dataset.productPanel === state.currentProductTab));
    }));
    qsa("[data-order-tab]").forEach(button => button.addEventListener("click", () => {
      state.currentOrderTab = button.dataset.orderTab;
      qsa("[data-order-tab]").forEach(item => item.classList.toggle("active", item === button));
      renderOrders();
      refreshOrderTab(state.currentOrderTab);
    }));
    qsa("[data-range]").forEach(button => button.addEventListener("click", () => {
      refreshAnalytics({range: button.dataset.range});
    }));
    qsa("[data-advanced-tab]").forEach(button => button.addEventListener("click", () => {
      qsa("[data-advanced-tab]").forEach(item => item.classList.toggle("active", item === button));
      qsa("[data-advanced-panel]").forEach(panel => panel.classList.toggle("active", panel.dataset.advancedPanel === button.dataset.advancedTab));
    }));
    qsa("[data-close-drawer]").forEach(button => button.addEventListener("click", closeDrawers));
    $("drawer-scrim").addEventListener("click", closeDrawers);
    $("advanced-btn").addEventListener("click", () => { openDrawer("advanced-drawer"); loadTraceIndex(); });
    $("open-platform-rules-btn").addEventListener("click", showPlatformRulesDetails);
    $("load-trace-btn").addEventListener("click", loadTraceIndex);
    $("trace-step-select").addEventListener("change", event => loadTraceStep(event.target.value));
    $("refresh-btn").addEventListener("click", () => runAutoRefresh({automatic: false}));
    $("memory-read-btn").addEventListener("click", () => callTools([
      ["read_memory_doc", {}],
    ], {label: "read operating memory"}));
    $("memory-save-btn").addEventListener("click", () => callTools([
      ["write_memory_doc", {content: $("memory-doc-input").value}],
    ], {label: "save operating memory"}));
    $("memory-doc-input").addEventListener("input", () => {
      state.memoryDirty = $("memory-doc-input").value !== state.memoryContent;
      renderMemory();
    });
    $("analytics-refresh-btn").addEventListener("click", refreshAnalytics);
    $("analytics-level").addEventListener("change", event => {
      const level = event.target.value;
      syncAnalyticsControls();
      refreshAnalytics({level});
    });
    $("rank-metric").addEventListener("change", event => {
      const sortBy = event.target.value;
      syncAnalyticsControls();
      refreshAnalytics({sortBy});
    });
    $("pause-run-btn").addEventListener("click", () => postRunControl(state.runState === "paused" ? "resume" : "pause"));
    $("finish-step-btn").addEventListener("click", () => {
      const waitSeconds = minimumStepWaitSeconds();
      if (waitSeconds > 0) {
        announce(`本轮至少停留 ${MIN_STEP_DURATION_SECONDS} 秒，还需等待 ${waitSeconds} 秒。`, "error");
        return;
      }
      callTools([["end_of_step", {}]], {label: "end current step"});
    });

    $("catalog-search-form").addEventListener("submit", event => { event.preventDefault(); searchCatalog(1); });
    $("listing-search-form").addEventListener("submit", event => {
      event.preventDefault();
      refreshListings({query: $("listing-query").value.trim()});
    });
    $("catalog-sort").addEventListener("change", () => searchCatalog(1));
    $("catalog-page-size").addEventListener("change", () => searchCatalog(1));
    $("order-history-form").addEventListener("submit", event => { event.preventDefault(); loadOrderHistory(1); });
    $("catalog-prev").addEventListener("click", () => searchCatalog(Number(state.catalogMeta?.page || 1) - 1));
    $("catalog-next").addEventListener("click", () => searchCatalog(Number(state.catalogMeta?.page || 1) + 1));
    $("order-history-prev").addEventListener("click", () => loadCurrentOrderPage(currentOrderPage() - 1));
    $("order-history-next").addEventListener("click", () => loadCurrentOrderPage(currentOrderPage() + 1));
    $("apply-price-multiplier").addEventListener("click", applyPriceMultiplier);
    $("apply-listing-price-multiplier").addEventListener("click", applyListingPriceMultiplier);
    $("delist-no-sales-btn").addEventListener("click", reviewAndConfirmNoSalesDelist);
    $("attention-list").addEventListener("click", event => {
      const button = event.target.closest('[data-attention-action="delist"]');
      if (!button || button.disabled) return;
      confirmRiskDelist(button.dataset.productId, button.dataset.productName, button.dataset.riskReason);
    });

    $("listings-table").addEventListener("click", event => {
      const detailButton = event.target.closest("[data-catalog-detail-tool]");
      if (detailButton) {
        if (!detailButton.disabled) {
          loadCatalogDetail(
            detailButton.dataset.catalogDetailTool,
            detailButton.dataset.productId,
            detailButton.dataset.supplierId,
          );
        }
        return;
      }
      const sortButton = event.target.closest("[data-listing-sort]");
      if (sortButton) {
        const sortBy = sortButton.dataset.listingSort;
        const sortOrder = state.listingSortBy === sortBy && state.listingSortOrder === "asc" ? "desc" : "asc";
        refreshListings({sortBy, sortOrder});
        return;
      }
      if (event.target.classList.contains("listing-price")) return;
      const row = event.target.closest("tr[data-listing-id]");
      if (!row) return;
      const id = row.dataset.listingId;
      state.listingSelection.has(id) ? state.listingSelection.delete(id) : state.listingSelection.add(id);
      renderListings(); syncSelectionControls();
    });
    $("listings-table").addEventListener("input", event => {
      if (!event.target.classList.contains("listing-price")) return;
      state.listingDrafts.set(event.target.dataset.productId, event.target.value);
    });
    $("catalog-table").addEventListener("click", event => {
      const detailButton = event.target.closest("[data-catalog-detail-tool]");
      if (detailButton) {
        if (!detailButton.disabled) {
          loadCatalogDetail(
            detailButton.dataset.catalogDetailTool,
            detailButton.dataset.productId,
            detailButton.dataset.supplierId,
          );
        }
        return;
      }
      if (event.target.classList.contains("catalog-price")) return;
      const row = event.target.closest("tr[data-catalog-id]");
      if (!row) return;
      const id = row.dataset.catalogId;
      state.catalogSelection.has(id) ? state.catalogSelection.delete(id) : state.catalogSelection.add(id);
      renderCatalog(); syncSelectionControls();
    });
    $("catalog-table").addEventListener("input", event => {
      if (!event.target.classList.contains("catalog-price")) return;
      state.catalogDrafts.set(event.target.dataset.productId, event.target.value);
    });
    $("select-all-listings").addEventListener("change", event => { state.listingSelection = event.target.checked ? new Set(state.listings.map(row => String(row.product_id))) : new Set(); renderListings(); syncSelectionControls(); });
    $("select-all-catalog").addEventListener("change", event => { state.catalogSelection = event.target.checked ? new Set(state.catalog.map(row => String(row.product_id))) : new Set(); renderCatalog(); syncSelectionControls(); });

    $("batch-list-btn").addEventListener("click", () => {
      const selectedItems = catalogMutationItems();
      const listedIds = state.activeListingIdsReady
        ? state.activeListingIds
        : new Set(state.listings.map(row => String(row.product_id)));
      const freeSlots = state.snapshot?.supply?.listings?.free_slots;
      const plan = catalogListingPlan(
        selectedItems,
        listedIds,
        state.activeListingIdsReady ? freeSlots : undefined,
      );
      if (!plan.items.length) {
        const shelf = state.snapshot?.supply?.listings || {};
        const message = `货架已满（${number(shelf.active)}/${number(shelf.max)}），请先下架商品再上架新商品。`;
        $("catalog-action-result").hidden = false;
        $("catalog-action-result").classList.add("has-error");
        $("catalog-action-result").textContent = message;
        announce(message, "error", 8000);
        return;
      }
      const capacityCopy = plan.blockedItems.length
        ? `；<strong>${plan.blockedItems.length}</strong> 项超出货架容量，本次不会提交并会保持选中`
        : "";
      confirmAction("确认批量上架", `本次提交 <strong>${plan.items.length}</strong> 项（新增 ${plan.newCount}，已上架调价 ${plan.existingCount}）${capacityCopy}。`, async () => {
        const response = await callTools([["list_product", {items: plan.items}], ["get_store_snapshot", {}]], {label: "batch list products"});
        await refreshDashboardData();
        state.catalogSelection = retainFailedSelection(state.catalogSelection, response, "list_product");
        showMutationFeedback(response, "list_product", plan.blockedItems.length);
      });
    });
    $("batch-price-btn").addEventListener("click", () => {
      const items = [...state.listingSelection].map(productId => ({product_id: productId, new_price: Number(state.listingDrafts.get(productId) || state.listings.find(row => String(row.product_id) === productId)?.sale_price)})).filter(item => item.new_price > 0);
      confirmAction("确认批量调价", `将提交 <strong>${items.length}</strong> 个商品的新售价。`, async () => {
        const response = await callTools([["adjust_price", {items}]], {label: "batch adjust prices"});
        await refreshDashboardData();
        state.listingSelection = retainFailedSelection(state.listingSelection, response, "adjust_price");
      });
    });
    $("batch-delist-btn").addEventListener("click", () => {
      const items = [...state.listingSelection].map(productId => ({product_id: productId}));
      confirmAction("确认批量下架", `将下架 <strong>${items.length}</strong> 个商品；历史订单和统计仍会保留。`, async () => {
        const response = await callTools([
          ["delist_product", {items}],
          ["get_store_snapshot", {}],
          ["query_supply_chain_anomalies", {mode: "new"}],
          ["query_supply_chain_anomalies", {mode: "now"}],
        ], {label: "batch delist products"});
        await refreshDashboardData();
        state.listingSelection = retainFailedSelection(state.listingSelection, response, "delist_product");
      }, true);
    });
    $("confirm-dialog").addEventListener("close", async () => {
      if ($("confirm-dialog").returnValue === "default" && state.pendingConfirm) await state.pendingConfirm();
      state.pendingConfirm = null;
      renderAll();
    });

    $("orders-table").addEventListener("click", event => {
      if (!canUseReadTurn() || !state.toolByName.has("query_order_detail")) return;
      const row = event.target.closest("tr[data-order-id]");
      if (row) callTools([["query_order_detail", {order_id: row.dataset.orderId}]], {label: `inspect order ${row.dataset.orderId}`});
    });
    qsa(".market-action").forEach(button => button.addEventListener("click", () => {
      const args = button.dataset.window ? {window_days: Number(button.dataset.window)} : {};
      callTools([[button.dataset.marketTool, args]], {label: `market query ${button.dataset.marketTool}`});
    }));
    $("raw-tool-call-btn").addEventListener("click", () => {
      let args;
      try { args = JSON.parse($("raw-tool-args").value || "{}"); }
      catch (error) { announce(`参数不是有效 JSON：${error.message}`, "error"); return; }
      callTools([["" + $("raw-tool-select").value, args]], {label: `raw tool ${$("raw-tool-select").value}`, raw: true});
    });
    window.addEventListener("resize", resizeVisibleCharts);
  }

  async function init() {
    $("turn-limit").textContent = Number(PLAYGROUND_CONFIG.maxTurnsPerStep || 0) || "∞";
    $("price-multiplier").value = String(state.priceMultiplier);
    $("listing-price-multiplier").value = String(state.listingPriceMultiplier);
    bindEvents();
    renderAll();
    state.elapsedTimer = setInterval(renderElapsed, 1000);
    try {
      await refreshStatus();
      if (state.finished) {
        await hydrateTerminalDashboard();
        return;
      }
      state.statusTimer = setInterval(refreshStatus, 10000);
      // A paused run may have survived a service restart while its in-memory
      // runtime did not. Keep the Resume control usable and reconnect lazily
      // after the explicit resume request recreates the worker.
      if (state.runState !== "paused") await activateRuntimeSession();
    } catch (error) {
      await refreshStatus();
      if (state.finished) {
        await hydrateTerminalDashboard();
        return;
      }
      announce(`工作台初始化失败：${error.message}`, "error", 10000);
      setStepCopy("无法连接运行环境", "请刷新页面或检查 Run 状态");
    }
  }

  init();
})();
</script>
