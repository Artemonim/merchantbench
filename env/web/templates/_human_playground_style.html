<style>
  :root {
    --fg: #0F1720;
    --muted: #64748B;
    --line: #CBD5E1;
    --bg: #F1F5F9;
    --panel: #FFFFFF;
    --accent: #168AAD;
    --good: #2F9E44;
    --bad: #E03131;
    --warn: #F08C00;
    --nav-width: 154px;
  }

  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    color: var(--fg);
    background: var(--bg);
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    font-size: 12px;
    line-height: 1.42;
  }
  button, input, select, textarea { font: inherit; }
  button, a { -webkit-tap-highlight-color: transparent; }
  a { color: inherit; text-decoration: none; }
  h1, h2, h3, p { margin: 0; }
  h1 { font-size: 17px; text-transform: uppercase; }
  h2 { font-size: 19px; text-transform: uppercase; }
  h3 { font-size: 12px; text-transform: uppercase; }
  .mono { font-family: inherit; }
  .subtle { color: var(--muted); font-size: 10px; }
  .eyebrow { color: var(--accent); font-size: 9px; font-weight: 800; letter-spacing: .08em; }

  .command-bar {
    position: sticky;
    top: 0;
    z-index: 30;
    min-height: 64px;
    padding: 8px 18px;
    display: grid;
    grid-template-columns: minmax(250px, 1fr) auto minmax(250px, 1fr);
    align-items: center;
    gap: 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--pixel-ink, var(--fg));
    box-shadow: 0 3px 0 var(--pixel-shadow, var(--line));
  }
  .brand-block, .command-actions, .run-strip { display: flex; align-items: center; }
  .brand-block { gap: 9px; min-width: 0; }
  .brand-block p { margin-top: 2px; color: var(--muted); font-size: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand-mark { width: 32px; height: 32px; display: grid; place-items: center; color: var(--panel); background: var(--pixel-ink, var(--fg)); border: 1px solid var(--pixel-ink, var(--fg)); box-shadow: 2px 2px 0 var(--pixel-shadow, var(--line)); font-size: 18px; font-weight: 900; }
  .run-strip { gap: 12px; padding: 6px 9px; color: var(--muted); background: var(--pixel-soft, #F8FAFC); border: 1px solid var(--pixel-ink, var(--fg)); white-space: nowrap; font-size: 10px; }
  .run-strip strong { color: var(--fg); font-variant-numeric: tabular-nums; }
  .simulation-clock { padding-left: 10px; border-left: 1px solid var(--line); }
  .simulation-clock small { margin-right: 5px; color: var(--accent); font-size: 8px; font-weight: 900; text-transform: uppercase; }
  .simulation-clock strong { font-size: 11px; }
  .command-actions { justify-content: flex-end; gap: 6px; }
  .status-pill { display: inline-flex; align-items: center; padding: 2px 6px; border: 1px solid var(--pixel-ink, var(--fg)); border-radius: 0; font-size: 9px; font-weight: 800; text-transform: uppercase; }
  .status-pill.neutral { color: var(--muted); background: #E5E7EB; }
  .status-pill.live { color: #fff; background: var(--good); }
  .status-pill.paused { color: var(--fg); background: #FBE7BC; }
  .status-pill.done { color: #fff; background: #475569; }

  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 31px; padding: 5px 10px; border: 1px solid var(--pixel-ink, var(--fg)); border-radius: 0; cursor: pointer; font-size: 10px; font-weight: 800; text-transform: uppercase; }
  .btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
  .btn.primary { color: #fff; background: var(--good); }
  .btn.ghost { color: var(--fg); background: var(--panel); }
  .btn.danger-soft { color: #fff; background: var(--bad); }
  .text-btn { padding: 2px 4px; color: var(--accent); border: 0; border-bottom: 1px solid var(--accent); background: none; box-shadow: none; cursor: pointer; font-size: 10px; font-weight: 800; }
  .text-btn:hover { transform: none; box-shadow: none; }
  .icon-btn { width: 30px; height: 30px; padding: 0; color: var(--fg); background: var(--panel); border: 1px solid var(--pixel-ink, var(--fg)); border-radius: 0; cursor: pointer; font-size: 19px; line-height: 1; }

  .notice { position: fixed; top: 74px; right: 18px; z-index: 60; max-width: 430px; padding: 9px 11px; color: var(--fg); background: #FFF3BF; border: 1px solid var(--pixel-ink, var(--fg)); border-radius: 0; box-shadow: 3px 3px 0 var(--pixel-shadow, var(--line)); font-size: 10px; }
  .notice.error { color: #fff; background: var(--bad); }
  .notice.inline { position: static; max-width: none; margin-bottom: 12px; box-shadow: 2px 2px 0 var(--pixel-shadow, var(--line)); }

  .global-rules-wrap { padding: 16px 28px 0; }
  .global-rules-wrap .platform-rules-panel { max-width: 1580px; margin: 0 auto; }
  .app-shell { display: grid; grid-template-columns: var(--nav-width) minmax(0, 1fr); min-height: calc(100vh - 64px); }
  .app-content { min-width: 0; }
  .side-nav { position: sticky; top: 67px; height: calc(100vh - 67px); padding: 17px 10px 84px; display: flex; flex-direction: column; gap: 8px; background: #E2E8F0; border-right: 1px solid var(--pixel-ink, var(--fg)); }
  .nav-item { width: 100%; padding: 9px 8px; display: flex; align-items: center; gap: 8px; color: var(--fg); background: var(--panel); border: 1px solid var(--pixel-ink, var(--fg)); border-radius: 0; box-shadow: 2px 2px 0 var(--pixel-shadow, var(--line)); cursor: pointer; text-align: left; font-size: 10px; font-weight: 800; }
  .nav-item span { color: var(--muted); font-size: 8px; }
  .nav-item.active { color: #fff; background: var(--pixel-ink, var(--fg)); box-shadow: 2px 2px 0 var(--accent); }
  .nav-item.active span { color: #93C5FD; }
  .nav-foot { margin-top: auto; padding: 7px 3px; display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 9px; }
  .live-dot { width: 7px; height: 7px; background: #94A3B8; border: 1px solid var(--pixel-ink, var(--fg)); }
  .side-nav.is-live .live-dot { background: var(--good); }

  .workspace { width: 100%; min-width: 0; max-width: 1580px; margin: 0 auto; padding: 26px 28px 104px; }
  .workspace-view { display: block; margin-bottom: 42px; scroll-margin-top: 132px; }
  .view-heading { min-height: 44px; margin-bottom: 12px; padding-bottom: 7px; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; border-bottom: 3px double var(--pixel-ink, var(--fg)); }
  .view-heading .eyebrow { margin-bottom: 3px; }

  .operations-jumpbar { position: sticky; top: 70px; z-index: 10; margin: -2px 0 12px; padding: 6px 8px; display: flex; align-items: center; gap: 6px; background: var(--pixel-soft, #F8FAFC); border: 1px solid var(--pixel-ink, var(--fg)); box-shadow: 2px 2px 0 var(--pixel-shadow, var(--line)); }
  .operations-jumpbar strong { margin-right: 4px; font-size: 9px; text-transform: uppercase; }
  .operations-jumpbar button { min-height: 25px; padding: 3px 8px; box-shadow: 1px 1px 0 var(--pixel-shadow, var(--line)); font-size: 9px; }

  .work-panel, .chart-panel, .product-panel {
    min-width: 0;
    background: var(--panel);
    border: 1px solid var(--pixel-ink, var(--fg));
    border-radius: 0;
    box-shadow: 3px 3px 0 var(--pixel-shadow, var(--line));
    overflow: hidden;
  }
  .panel-heading { min-height: 48px; padding: 9px 11px; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--pixel-soft, #F8FAFC); border-bottom: 1px solid var(--pixel-ink, var(--fg)); }
  .panel-heading p { margin-top: 2px; color: var(--muted); font-size: 9px; }
  .count-badge { min-width: 23px; height: 23px; padding: 0 5px; display: inline-grid; place-items: center; color: var(--fg); background: #FBE7BC; border: 1px solid var(--pixel-ink, var(--fg)); border-radius: 0; font-size: 10px; font-weight: 800; }

  .platform-rules-panel { margin-bottom: 12px; border-width: 2px; box-shadow: 5px 5px 0 var(--pixel-shadow, var(--line)); }
  .rules-heading { min-height: 66px; padding: 12px 14px; background: #FFF7ED; border-bottom-width: 2px; }
  .rules-heading h3 { margin-top: 2px; font-size: 16px; }
  .rules-heading p { margin-top: 5px; color: #334155; font-size: 11px; }
  .rules-heading .eyebrow { color: #C2410C; font-size: 10px; }
  .rules-heading-actions { display: flex; align-items: center; gap: 12px; }
  .rule-priority-badge { padding: 5px 8px; color: #fff; background: var(--bad); border: 1px solid var(--pixel-ink, var(--fg)); box-shadow: 2px 2px 0 var(--pixel-shadow, var(--line)); font-size: 10px; font-weight: 900; }
  .rules-grid { display: grid; grid-template-columns: repeat(6, minmax(105px, 1fr)); }
  .rule-item { position: relative; min-height: 86px; padding: 13px 12px 12px 46px; background: #FFFEF7; border-right: 1px solid var(--pixel-ink, var(--fg)); }
  .rule-item:last-child { border-right: 0; }
  .rule-item > b { position: absolute; top: 15px; left: 12px; width: 25px; height: 25px; display: grid; place-items: center; color: #fff; background: var(--pixel-ink, var(--fg)); border: 1px solid var(--pixel-ink, var(--fg)); box-shadow: 2px 2px 0 var(--pixel-shadow, var(--line)); font-size: 10px; }
  .rule-item span { display: block; margin-bottom: 7px; color: #475569; font-size: 10px; font-weight: 800; text-transform: uppercase; }
  .rule-item strong { display: block; font-size: 14px; line-height: 1.35; }
  .rule-item.danger-rule { color: #7F1D1D; background: #FFF1F2; }
  .rule-item.danger-rule > b { background: var(--bad); }
  .rule-details-grid { display: grid; grid-template-columns: minmax(280px, .85fr) minmax(520px, 1.65fr); border-top: 2px solid var(--pixel-ink, var(--fg)); }
  .rule-detail-block { min-width: 0; padding: 12px 14px 14px; }
  .rule-detail-block + .rule-detail-block { border-left: 1px solid var(--pixel-ink, var(--fg)); }
  .rule-detail-block > strong { display: block; margin-bottom: 7px; font-size: 12px; text-transform: uppercase; }
  .refund-rule { color: #0C4A6E; background: #E0F2FE; }
  .penalty-rule { color: #7C2D12; background: #FFF7ED; }
  .refund-strip, .penalty-strip { margin: 0; padding: 0; color: inherit; background: transparent; border: 0; white-space: normal; overflow: visible; line-height: 1.65; }
  .refund-strip { font-size: 12px; }
  .penalty-strip { font-size: 13px; font-weight: 700; }

  .overview-assets-grid { margin-bottom: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .chart.chart-overview-asset { height: 245px; }
  .overview-metric-grid { margin-bottom: 12px; display: grid; grid-template-columns: repeat(3, minmax(220px, 1fr)); gap: 12px; }
  .chart.chart-overview-metric { height: 225px; }
  .rating-metric-panel .panel-heading { background: #FFFBEB; }
  .tool-source { padding: 2px 5px; color: var(--accent); background: #E0F2FE; border: 1px solid var(--pixel-ink, var(--fg)); font-size: 8px; font-weight: 800; text-transform: uppercase; }

  .overview-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .span-2 { grid-column: span 2; }
  .attention-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 10px; }
  .attention-item { min-height: 60px; padding: 8px; display: flex; gap: 8px; background: var(--pixel-soft, #F8FAFC); border: 1px solid var(--pixel-ink, var(--fg)); }
  .attention-copy { min-width: 0; display: flex; flex: 1; flex-direction: column; align-items: flex-start; }
  .attention-item strong { display: block; font-size: 10px; }
  .attention-item p { margin: 2px 0 8px; color: var(--muted); font-size: 9px; }
  .attention-action { min-height: 24px; margin-top: auto; padding: 2px 7px; font-size: 8px; }
  .attention-icon { width: 22px; height: 22px; flex: 0 0 22px; display: grid; place-items: center; color: var(--fg); background: #FBE7BC; border: 1px solid var(--pixel-ink, var(--fg)); font-weight: 900; }
  .mini-table { padding: 6px 10px 9px; }
  .mini-row { padding: 6px 2px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; border-bottom: 1px dotted var(--line); font-size: 9px; }
  .mini-row:last-child { border-bottom: 0; }
  .mini-row span { color: var(--muted); }
  .risk-mini-row { grid-template-columns: minmax(130px, .7fr) minmax(200px, 1.3fr); }
  .risk-mini-row > span { text-align: right; }

  .segmented { padding: 2px; display: inline-flex; gap: 3px; background: #E2E8F0; border: 1px solid var(--pixel-ink, var(--fg)); border-radius: 0; }
  .segmented button { min-height: 25px; padding: 3px 8px; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 0; box-shadow: none; cursor: pointer; font-size: 9px; font-weight: 800; }
  .segmented button.active { color: #fff; background: var(--pixel-ink, var(--fg)); border-color: var(--pixel-ink, var(--fg)); }
  .product-panel { display: none; }
  .product-panel.active { display: block; }
  .table-toolbar { min-height: 48px; padding: 8px 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--pixel-ink, var(--fg)); }
  .table-toolbar strong { margin-right: 8px; font-size: 10px; }
  .listing-toolbar-summary { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .sales-heat-legend { display: inline-flex; align-items: center; gap: 3px; color: var(--muted); font-size: 8px; }
  .sales-heat-legend i { width: 10px; height: 10px; display: inline-block; border: 1px solid rgba(15, 23, 32, .2); }
  .sales-heat-legend i:nth-of-type(1) { background: #F0FDF4; }
  .sales-heat-legend i:nth-of-type(2) { background: #BBF7D0; }
  .sales-heat-legend i:nth-of-type(3) { background: #4ADE80; }
  .capacity-label { margin-left: 9px; padding: 2px 5px; color: #0C4A6E; background: #E0F2FE; border: 1px solid var(--pixel-ink, var(--fg)); font-size: 8px; font-weight: 800; }
  .capacity-label.full { color: #fff; background: var(--bad); }
  .action-result { padding: 8px 10px; color: #14532D; background: #DCFCE7; border-bottom: 1px solid var(--pixel-ink, var(--fg)); font-size: 9px; font-weight: 800; }
  .action-result.has-error { color: #7C2D12; background: #FFEDD5; }
  .toolbar-actions { display: flex; align-items: flex-end; justify-content: flex-end; gap: 6px; flex-wrap: wrap; }
  .toolbar-multiplier { width: 86px; flex: 0 0 86px; }
  .toolbar-multiplier input { min-height: 31px; }
  .pagination-controls { display: inline-flex; align-items: center; gap: 5px; }
  .pagination-controls span { min-width: 54px; color: var(--muted); text-align: center; font-size: 9px; white-space: nowrap; }
  .pagination-controls .btn { min-height: 27px; padding: 3px 7px; }
  .order-pagination { padding: 7px 10px; justify-content: flex-end; background: var(--pixel-soft, #F8FAFC); border-bottom: 1px solid var(--pixel-ink, var(--fg)); }
  .filter-bar { padding: 9px 10px; display: grid; grid-template-columns: minmax(220px, 1.5fr) repeat(3, minmax(115px, .65fr)) auto; gap: 7px; align-items: end; background: var(--pixel-soft, #F8FAFC); border-bottom: 1px solid var(--pixel-ink, var(--fg)); }
  .filter-bar.compact { grid-template-columns: repeat(5, minmax(100px, 1fr)) auto; }
  .filter-bar.catalog-filter { display: block; }
  .listing-filter { padding: 9px 10px; display: grid; grid-template-columns: minmax(240px, 1fr) auto minmax(250px, auto); gap: 7px; align-items: end; background: var(--pixel-soft, #F8FAFC); border-bottom: 1px solid var(--pixel-ink, var(--fg)); }
  .tool-contract { align-self: center; color: var(--accent); font-size: 8px; font-weight: 800; text-align: right; }
  .catalog-filter-primary { display: grid; grid-template-columns: minmax(220px, 1.5fr) repeat(3, minmax(105px, .65fr)) minmax(140px, .8fr) minmax(90px, .5fr) auto; gap: 7px; align-items: end; }
  .catalog-advanced-filters { margin-top: 7px; border: 1px solid var(--line); background: var(--panel); }
  .catalog-advanced-filters summary { padding: 6px 8px; color: var(--accent); cursor: pointer; font-size: 9px; font-weight: 800; text-transform: uppercase; }
  .catalog-filter-secondary { padding: 8px; display: grid; grid-template-columns: repeat(5, minmax(120px, 1fr)); gap: 7px; border-top: 1px solid var(--line); }
  .filter-contract-note { margin-top: 6px; color: var(--muted); font-size: 8px; }
  .filter-contract-note strong { color: var(--accent); }
  .multiplier-bar { padding: 8px 10px; display: grid; grid-template-columns: minmax(250px, 1fr) 100px auto; gap: 8px; align-items: end; background: #E0F2FE; border-bottom: 1px solid var(--pixel-ink, var(--fg)); }
  .multiplier-bar strong, .multiplier-bar span { display: block; }
  .multiplier-bar strong { font-size: 10px; text-transform: uppercase; }
  .multiplier-bar span { margin-top: 2px; color: var(--muted); font-size: 8px; }
  label { display: block; color: var(--muted); font-size: 9px; }
  label > span { display: block; margin-bottom: 3px; font-weight: 800; text-transform: uppercase; }
  input, select, textarea { width: 100%; min-height: 30px; padding: 5px 7px; color: var(--fg); background: var(--panel); border: 1px solid var(--pixel-ink, var(--fg)); border-radius: 0; outline: none; }
  input[type="checkbox"] { width: 14px; min-height: 14px; accent-color: var(--accent); }
  .data-table-wrap { width: 100%; max-height: calc(100vh - 220px); overflow: auto; }
  .data-table { width: 100%; border-collapse: collapse; border: 0; font-size: 9px; }
  .data-table th { position: sticky; top: 0; z-index: 2; padding: 7px 8px; color: var(--fg); background: var(--pixel-table-header-bg, #F8FAFC); border: 1px solid var(--pixel-ink, var(--fg)); text-align: left; font-size: 8px; text-transform: uppercase; white-space: nowrap; }
  .table-sort { padding: 0; color: inherit; background: transparent; border: 0; box-shadow: none; cursor: pointer; font: inherit; font-weight: 800; text-transform: uppercase; }
  .table-sort:hover, .table-sort.active { color: var(--accent); transform: none; box-shadow: none; }
  .sort-indicator { display: inline-block; min-width: 8px; }
  .data-table th small { display: block; margin-top: 2px; color: var(--muted); font-size: 7px; font-weight: 500; text-transform: none; }
  .data-table td { padding: 7px 8px; border: 1px solid var(--line); vertical-align: middle; font-variant-numeric: tabular-nums; }
  .data-table tbody tr { cursor: pointer; }
  .data-table tbody tr.selected { background: var(--pixel-table-selected-bg, #D7E7FB); }
  .order-product-cell { min-width: 180px; display: grid; gap: 2px; }
  .order-product-name { max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 10px; }
  #listings-table tbody tr.sales-heat-1 { background: #F0FDF4; }
  #listings-table tbody tr.sales-heat-2 { background: #DCFCE7; }
  #listings-table tbody tr.sales-heat-3 { background: #BBF7D0; }
  #listings-table tbody tr.sales-heat-4 { background: #86EFAC; }
  #listings-table tbody tr.sales-heat-5 { background: #4ADE80; }
  #listings-table tbody tr.selected { outline: 3px solid var(--accent); outline-offset: -3px; }
  .sales-cell strong, .sales-cell span { display: block; }
  .sales-cell strong { font-size: 11px; }
  .sales-pips { margin-top: 2px; color: #166534; font-size: 8px; letter-spacing: -1px; white-space: nowrap; }
  .data-table .check-col { width: 33px; text-align: center; }
  .table-product { min-width: 180px; }
  .table-product strong { display: block; max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .table-product span { color: var(--muted); font-size: 8px; }
  .price-input { width: 86px; min-height: 26px; padding: 3px 5px; }
  .price-ratio-meter { position: relative; width: 86px; height: 25px; overflow: hidden; background: #E5E7EB; border: 1px solid var(--pixel-ink, var(--fg)); }
  .price-ratio-meter > span { position: absolute; inset: 0 auto 0 0; width: var(--ratio-width); background: #86BFA0; }
  .price-ratio-meter strong { position: relative; z-index: 1; height: 100%; display: grid; place-items: center; color: var(--fg); font-size: 9px; font-variant-numeric: tabular-nums; text-shadow: 0 1px rgba(255,255,255,.8); }
  .price-ratio-meter.loss > span { background: #DC2626; }
  .price-ratio-meter.loss strong { color: #fff; text-shadow: 0 1px #7F1D1D; }
  .price-ratio-meter.risk > span { background: #F97316; }
  .price-ratio-meter.warn > span { background: #FACC15; }
  .price-ratio-meter.good > span { background: #4ADE80; }
  .price-ratio-meter.strong > span { background: #15803D; }
  .price-ratio-meter.strong strong { color: #fff; text-shadow: 0 1px #14532D; }
  .status-tag { display: inline-flex; padding: 2px 5px; color: var(--fg); background: #E2E8F0; border: 1px solid var(--pixel-ink, var(--fg)); border-radius: 0; font-size: 8px; font-weight: 800; }
  .status-tag.late, .status-tag.cancelled, .status-tag.stockout, .status-tag.insufficient_balance, .status-tag.settled_refund, .status-tag.settled_only_refund, .status-tag.settled_bad_review, .status-tag.bad_review { color: #fff; background: var(--bad); }
  .status-tag.shipped, .status-tag.delivered { color: #fff; background: var(--accent); }
  .status-tag.settled_normal, .status-tag.settled { color: #fff; background: var(--good); }
  .empty-state { padding: 22px 14px; color: var(--muted); text-align: center; font-size: 9px; }
  .table-caption { padding: 7px 10px; color: var(--fg); background: var(--pixel-soft, #F8FAFC); border-bottom: 1px solid var(--pixel-ink, var(--fg)); font-size: 9px; font-weight: 800; text-transform: uppercase; }

  .orders-layout { display: grid; grid-template-columns: minmax(230px, .32fr) minmax(620px, 1fr); gap: 12px; align-items: start; }
  .order-table-panel { min-width: 0; }
  .chart { height: 290px; width: 100%; background-color: var(--panel); background-image: linear-gradient(var(--pixel-chart-paper, #EEF2F7) 1px, transparent 1px), linear-gradient(90deg, var(--pixel-chart-paper, #EEF2F7) 1px, transparent 1px); background-size: 16px 16px; }
