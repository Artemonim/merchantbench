<style>

  :root {
    --pixel-ink: #0F1720;

    --pixel-soft: #F8FAFC;
    --pixel-grid: #E5E7EB;
    --pixel-hover: #F1F5F9;
    --pixel-focus: #168AAD;

    --pixel-table-sticky-bg: #F1F5F9;
    --pixel-table-hover-bg: #EEF2F7;
    --pixel-table-selected-bg: #D7E7FB;
    --pixel-chart-bg: var(--panel);
    --pixel-chart-paper: #EEF2F7;
    --pixel-chart-ink: #0F1720;
    --pixel-chart-grid: #E5E7EB;
    --pixel-chart-muted: var(--muted);

  body {
    background:
      linear-gradient(var(--pixel-grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--pixel-grid) 1px, transparent 1px),
      var(--bg);
    background-size: 24px 24px;
  }

    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }
  a:hover {
    text-decoration: none;
    border-bottom-color: currentColor;
  }

  .topbar {
    background: var(--panel);
    border-bottom: 1px solid var(--pixel-ink);
    box-shadow: 0 3px 0 var(--pixel-shadow);
  }

  .section, .card {
    background: var(--pixel-surface);
    border: 1px solid var(--pixel-ink);
    border-radius: 0 !important;
    box-shadow: 3px 3px 0 var(--pixel-shadow);

  button:hover {
    background: var(--pixel-hover);
    transform: translate(-1px, -1px);
    box-shadow: 3px 3px 0 var(--pixel-shadow);

    border-color: var(--pixel-ink);
    color: #fff;
  }

    background: var(--bad);
    border-color: var(--pixel-ink);
    color: #fff;

  table {
